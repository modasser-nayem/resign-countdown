<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="2.5"/>

  <!-- Glowing circle ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Rocket Body / Freedom Symbol -->
  <g transform="translate(14, 12)">
    <!-- Exhaust fire -->
    <path d="M 18 29 Q 15 35 12 33 Q 15 28 17 26 Z" fill="#ef4444"/>
    <path d="M 16 30 Q 14 34 13 32 Q 14 28 16 26 Z" fill="#fbbf24"/>

    <!-- Left wing -->
    <path d="M 10 24 L 6 27 L 9 20 Z" fill="#d97706"/>
    <!-- Right wing -->
    <path d="M 22 12 L 29 15 L 25 19 Z" fill="#d97706"/>

    <!-- Main rocket fuselage -->
    <path d="M 11 25 Q 11 15 28 8 Q 21 25 11 25 Z" fill="url(#glowGrad)" filter="url(#glow)"/>

    <!-- Rocket window -->
    <circle cx="19" cy="16" r="3" fill="#0f172a" stroke="#ffffff" stroke-width="1"/>
    <circle cx="20" cy="15" r="0.9" fill="#38bdf8"/>
  </g>

  <!-- Freedom Badge "21" -->
  <rect x="36" y="38" width="22" height="18" rx="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
  <text x="47" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#000000" text-anchor="middle">21</text>
</svg>
